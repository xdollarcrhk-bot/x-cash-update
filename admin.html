<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X CASH UPDATE Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3fa;color:#24213c;font:15px system-ui}.header{background:#211d46;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #201d460d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{font-size:26px;font-weight:bold;color:#594aa6}input,textarea,button{font:inherit;padding:10px;border:1px solid #ddd;border-radius:9px}input,textarea{width:100%;margin:5px 0}button{cursor:pointer;background:#f0c44d;border:0;font-weight:700;margin:4px}button.alt{background:#eee}.row{border-bottom:1px solid #eee;padding:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#777}section{display:none}section.show{display:block}.tabs{display:flex;flex-wrap:wrap;gap:5px}.error{color:#b42318}</style></head><body><div class="header"><b>✦ X CASH UPDATE — ADMIN</b></div><main class="wrap">
<div id="login" class="card"><h2>Admin login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="msg" class="error"></p></div>
<div id="app" style="display:none"><div class="grid" id="stats"></div><div class="card tabs"><button onclick="show('payments')">Membership payments</button><button onclick="show('tasks')">Tasks</button><button onclick="show('submissions')">Task approvals</button><button onclick="show('withdrawals')">Withdrawals</button><button onclick="show('members')">Members</button><button class="alt" onclick="logout()">Log out</button></div>
<section id="payments" class="show card"><h2>Payment verification queue</h2><div id="paymentList"></div></section>
<section id="tasks" class="card"><h2>Create task</h2><input id="taskTitle" placeholder="Task title"><textarea id="taskDesc" placeholder="Task instructions"></textarea><input id="taskReward" type="number" placeholder="Reward in NGN"><button onclick="createTask()">Publish task</button><h3>Current tasks</h3><div id="taskList"></div></section>
<section id="submissions" class="card"><h2>Task submissions</h2><div id="subList"></div></section>
<section id="withdrawals" class="card"><h2>Withdrawal requests</h2><div id="withdrawList"></div></section>
<section id="members" class="card"><h2>Members</h2><div id="memberList"></div></section></div></main>
<script>
async function api(path,opts={}){let r=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{await api('/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';await load()}catch(e){msg.textContent=e.message}}
async function logout(){await api('/logout',{method:'POST'});location.reload()}
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.remove('show'));document.getElementById(id).classList.add('show')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){let summary=await api('/admin/summary');stats.innerHTML=Object.entries(summary).map(([k,v])=>`<div class="card"><div class="muted">${esc(k)}</div><div class="stat">${v}</div></div>`).join('');
let ps=await api('/admin/payments');paymentList.innerHTML=ps.map(p=>`<div class="row"><div><b>${esc(p.name)}</b> (${esc(p.email)})<br>₦${p.amount} · Ref: ${esc(p.reference||'—')}<br><small>${esc(p.proof_note||'')}</small> · ${p.status}</div>${p.status==='pending'?`<div><button onclick="reviewPayment(${p.id},'approve')">Approve & activate</button><button class="alt" onclick="reviewPayment(${p.id},'reject')">Reject</button></div>`:''}</div>`).join('')||'No submissions';
let ts=await api('/admin/tasks');taskList.innerHTML=ts.map(t=>`<div class="row">${esc(t.title)} — ₦${t.reward} · ${t.active?'Active':'Paused'} <button class="alt" onclick="toggleTask(${t.id})">Toggle</button></div>`).join('');
let ss=await api('/admin/submissions');subList.innerHTML=ss.map(s=>`<div class="row"><div>${esc(s.name)}: ${esc(s.title)}<br>Proof: ${esc(s.proof||'none')} · ${s.status}</div>${s.status==='pending'?`<button onclick="reviewSub(${s.id},'approve')">Approve + reward</button><button class="alt" onclick="reviewSub(${s.id},'reject')">Reject</button>`:''}</div>`).join('')||'No submissions';
let ws=await api('/admin/withdrawals');withdrawList.innerHTML=ws.map(w=>`<div class="row"><div><b>${esc(w.name)}</b> requests ₦${w.amount}<br>${esc(w.bank_name)} · ${esc(w.account_number)} · ${esc(w.account_name)} · ${w.status}</div>${w.status==='pending'?`<button onclick="paid(${w.id})">Mark paid</button><button class="alt" onclick="rejectW(${w.id})">Reject & refund</button>`:''}</div>`).join('')||'No requests';
let ms=await api('/admin/members');memberList.innerHTML=ms.map(m=>`<div class="row">${esc(m.name)} · ${esc(m.email)} · ${m.status} · joined ${m.created_at}</div>`).join('')||'No members'}
async function reviewPayment(id,action){await api(`/admin/payments/${id}/${action}`,{method:'POST'});load()}
async function createTask(){await api('/admin/tasks',{method:'POST',body:JSON.stringify({title:taskTitle.value,description:taskDesc.value,reward:Number(taskReward.value)})});taskTitle.value='';taskDesc.value='';taskReward.value='';load()}
async function toggleTask(id){await api(`/admin/tasks/${id}/toggle`,{method:'POST'});load()}
async function reviewSub(id,a){await api(`/admin/submissions/${id}/${a}`,{method:'POST'});load()}
async function paid(id){if(confirm('Confirm this withdrawal has actually been paid?')){await api(`/admin/withdrawals/${id}/paid`,{method:'POST'});load()}}
async function rejectW(id){let note=prompt('Reason (optional)');await api(`/admin/withdrawals/${id}/reject`,{method:'POST',body:JSON.stringify({note})});load()}
(async()=>{try{await api('/me');document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}catch(e){}})();
</script></body></html>
